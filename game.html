<!DOCTYPE html>
<html>
<head>
    <title>RPG World - AI Dungeon Master</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            width: 400px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; margin-bottom: 30px; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
        }
        input::placeholder { color: rgba(255,255,255,0.6); }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: #6c63ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #5a52d5; transform: scale(1.02); }
        .switch { text-align: center; margin-top: 15px; cursor: pointer; color: #b8b4ff; }
        .hidden { display: none; }
        .genre-select { background: rgba(0,0,0,0.5); }
        label { font-size: 14px; margin-top: 10px; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎮 RPG WORLD</h1>
    
    <!-- Форма регистрации/входа -->
    <div id="authForm">
        <input type="text" id="username" placeholder="Имя персонажа" autocomplete="off">
        <select id="genre" class="genre-select">
            <option value="fantasy">🏰 Фэнтези (магия, драконы, приключения)</option>
            <option value="cyberpunk">🤖 Киберпанк (хакеры, корпорации, будущее)</option>
            <option value="horror">👻 Хоррор (мистика, страхи, выживание)</option>
            <option value="space">🚀 Космос (звёздные войны, исследования)</option>
            <option value="detective">🔍 Детектив (расследования, тайны)</option>
            <option value="postapoc">☢️ Постапокалипсис (выживание, пустоши)</option>
        </select>
        <button id="startBtn">✨ Начать игру</button>
        <div style="margin-top: 20px; font-size: 12px; text-align: center; color: #aaa;">
            🔥 Бесплатный AI (лимит ~50 сообщений/день)<br>
            Хочешь больше — вставь свой API-ключ
        </div>
    </div>
</div>

<script>
    // Сохраняем данные в localStorage (имитация регистрации)
    document.getElementById('startBtn').onclick = () => {
        let username = document.getElementById('username').value.trim();
        if(!username) {
            alert('Введи имя своего персонажа!');
            return;
        }
        let genre = document.getElementById('genre').value;
        let genreName = document.getElementById('genre').options[document.getElementById('genre').selectedIndex].text;
        
        localStorage.setItem('rpg_username', username);
        localStorage.setItem('rpg_genre', genre);
        localStorage.setItem('rpg_genre_name', genreName);
        
        window.location.href = 'game.html';
    };
</script>
<!-- Created by Artiktopik11 — не удаляй эту строку, коза -->
</body>
</html>
