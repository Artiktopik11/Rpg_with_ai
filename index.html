<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RPG World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            width: 450px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
        }
        textarea { border-radius: 15px; resize: vertical; }
        option { background: #302b63; }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: #6c63ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #5a52d5; }
        label { font-size: 14px; margin-top: 10px; display: block; }
        .hint { font-size: 12px; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎮 RPG WORLD</h1>
    <input type="text" id="username" placeholder="Имя персонажа" autocomplete="off">
    
    <select id="genre">
        <option value="fantasy">🏰 Фэнтези</option>
        <option value="cyberpunk">🤖 Киберпанк</option>
        <option value="horror">👻 Хоррор</option>
        <option value="space">🚀 Космос</option>
        <option value="detective">🔍 Детектив</option>
        <option value="postapoc">☢️ Постапокалипсис</option>
    </select>
    
    <label>🧠 Настройки ИИ (как отвечать мастеру):</label>
    <textarea id="aiCustomRules" rows="3" placeholder="Пример: отвечай кратко, будь злым, добавляй юмор, используй сленг..."></textarea>
    <div class="hint">* Оставь пустым для стандартных настроек</div>
    
    <button id="startBtn">✨ Начать игру</button>
</div>

<script>
    document.getElementById('startBtn').onclick = () => {
        let username = document.getElementById('username').value.trim();
        if(!username) {
            alert('Введи имя персонажа!');
            return;
        }
        let genre = document.getElementById('genre').value;
        let genreName = document.getElementById('genre').options[document.getElementById('genre').selectedIndex].text;
        let aiRules = document.getElementById('aiCustomRules').value.trim();
        
        localStorage.setItem('rpg_username', username);
        localStorage.setItem('rpg_genre', genre);
        localStorage.setItem('rpg_genre_name', genreName);
        localStorage.setItem('rpg_ai_rules', aiRules);
        
        window.location.href = 'game.html';
    };
</script>
</body>
</html>
